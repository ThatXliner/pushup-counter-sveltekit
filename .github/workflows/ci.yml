name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify TLS certificate rejection
        run: node .github/scripts/check-tls.cjs

      - name: Install dependencies
        run: npm ci

      - name: Setup tests
        run: |
          git lfs pull
          tar xzf pushup.tar.gz
        working-directory: tests/assets

      - name: Run tests
        run: npm test
